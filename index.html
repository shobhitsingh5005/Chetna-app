<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHETNA Bio-Digital OS - Terminal v1.1</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --terminal-box: #0a0f1d;
            --neon-green: #00ff66;
            --neon-cyan: #00e5ff;
            --neon-red: #ff0055;
            --matrix-glow: rgba(0, 255, 102, 0.2);
            --text-color: #d1f4ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .terminal-container {
            max-width: 600px;
            width: 100%;
            background: var(--terminal-box);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            box-sizing: border-box;
        }

        .system-header {
            text-align: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--neon-green);
            font-size: 20px;
            margin: 0;
            text-shadow: 0 0 10px var(--matrix-glow);
            letter-spacing: 2px;
        }

        .status-tag {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 5px;
        }

        .radar-box {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #020408;
            border: 1px solid var(--neon-green);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .graph-wrapper {
            background: #020408;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            height: 100px;
            position: relative;
        }

        .graph-title {
            font-size: 10px;
            color: #64748b;
            position: absolute;
            top: 5px;
            left: 10px;
            text-transform: uppercase;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .metric-card {
            background: #020408;
            border-left: 4px solid var(--neon-green);
            padding: 12px;
            border-radius: 4px;
        }

        .metric-card.stress { border-left-color: var(--neon-red); }

        .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }

        #stressVal { color: var(--neon-red); }
        #focusVal { color: var(--neon-green); }

        .status-bar {
            background: #020408;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        #statusText {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .alert-active {
            color: var(--neon-red) !important;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="system-header">
        <h1>[CHETNA BIO-DIGITAL OS v1.1]</h1>
        <div class="status-tag">CORE STATUS: ACTIVE // KEYSTROKE RADAR ONLINE</div>
    </div>

    <div class="radar-box">
        <textarea id="hackerInput" placeholder="> यहाँ टाइप करना शुरू करें... बायो-सिग्नल्स रडार सक्रिय हो जाएगा..."></textarea>
    </div>

    <div class="graph-wrapper">
        <div class="graph-title">// लाइव न्यूरो-बायो स्पेक्ट्रोग्राम (LIVE KEYSTROKE SIGNALS)</div>
        <canvas id="liveGraph"></canvas>
    </div>

    <div class="metrics-grid">
        <div class="metric-card stress">
            <div class="label">// तनाव इंडेक्स (STRESS)</div>
            <div id="stressVal" class="value">0%</div>
        </div>
        <div class="metric-card">
            <div class="label">// दिमागी एकाग्रता (FOCUS)</div>
            <div id="focusVal" class="value">0%</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="label">// सिस्टम डायग्नोस्टिक्स विश्लेषण</div>
        <div id="statusText" style="color: var(--neon-cyan);">WAITING FOR BIO-INPUT...</div>
    </div>
</div>

<script>
    const hackerInput = document.getElementById('hackerInput');
    const stressVal = document.getElementById('stressVal');
    const focusVal = document.getElementById('focusVal');
    const statusText = document.getElementById('statusText');
    const canvas = document.getElementById('liveGraph');
    const ctx = canvas.getContext('2d');

    let totalKeys = 0;
    let backspaceCount = 0;
    let startTime = null;
    let waveOffset = 0;
    let animationId = null;
    let currentStress = 0;
    let currentFocus = 0;
    let isCurrentlyFake = false;

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // स्वतंत्र हाइब्रिड ग्राफ एनीमेशन जो बिना परमिशन लॉक के तुरंत चलेगा
    function animateGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.lineWidth = 2;
        
        if (isCurrentlyFake) {
            ctx.strokeStyle = '#ff0055'; // फेक इनपुट पर लाल डैमेज लहरें
        } else {
            ctx.strokeStyle = '#00e5ff'; // असली इनपुट पर नीली लहरें
        }

        let textLen = hackerInput.value.length;
        // अगर यूजर टाइप कर रहा है तो लहरें ऊंची होंगी, शांत होने पर पतली सीधी लकीर
        let amplitude = textLen > 0 ? (currentStress > 50 ? 25 : 12) : 2;
        let frequency = isCurrentlyFake ? 0.2 : 0.08;

        for (let x = 0; x < canvas.width; x++) {
            let y = (canvas.height / 2) + Math.sin(x * frequency + waveOffset) * amplitude;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        waveOffset += 0.15;
        animationId = requestAnimationFrame(animateGraph);
    }

    // एनीमेशन लूप तुरंत चालू करें (यह बिना माइक लॉक के हमेशा बैकग्राउंड में रहेगा)
    animateGraph();

    hackerInput.addEventListener('input', (e) => {
        if (!startTime) startTime = Date.now();

        let val = hackerInput.value;

        if (e.inputType === 'deleteContentBackward') {
            backspaceCount++;
        }
        totalKeys = val.length + backspaceCount;

        let timePassed = (Date.now() - startTime) / 60000;
        let cpm = timePassed > 0 ? Math.round(val.length / timePassed) : 0;

        // --- एंटी-फेक (किडमिट-किडमिट) फ़िल्टर ---
        let words = val.split(' ');
        let longestWord = Math.max(...words.map(w => w.length));
        isCurrentlyFake = longestWord > 12 && val.length > 15;

        if (val.length === 0) {
            currentStress = 0;
            currentFocus = 0;
            stressVal.innerText = "0%";
            focusVal.innerText = "0%";
            statusText.innerText = "WAITING FOR BIO-INPUT...";
            statusText.className = "";
            statusText.style.color = "var(--neon-cyan)";
            return;
        }

        if (isCurrentlyFake) {
            stressVal.innerText = "--";
            focusVal.innerText = "--";
            statusText.innerText = "[ALERT: FAKE INTENT / TIME-PASS DETECTED]";
            statusText.className = "alert-active";
            statusText.style.color = "var(--neon-red)";
        } else {
            currentFocus = Math.min(Math.max(Math.round(cpm / 2.5), 15), 98);
            
            let baseStress = 12;
            if (totalKeys > 0) {
                baseStress += Math.round((backspaceCount / totalKeys) * 140);
            }
            if (cpm > 240) baseStress += 20; 
            currentStress = Math.min(Math.max(baseStress, 6), 95);

            stressVal.innerText = currentStress + "%";
            focusVal.innerText = currentFocus + "%";

            if (currentStress > 58) {
                statusText.innerText = "[🚨 CRITICAL EMOTIONAL OVERLOAD / ALERT SENT]";
                statusText.className = "alert-active";
                statusText.style.color = "var(--neon-red)";
            } else if (currentFocus > 65) {
                statusText.innerText = "[SYSTEM STATUS: HYPER FOCUS / ALPHA MODE]";
                statusText.className = "";
                statusText.style.color = "var(--neon-green)";
            } else {
                statusText.innerText = "[SYSTEM STATUS: BALANCED MATRIX]";
                statusText.className = "";
                statusText.style.color = "var(--neon-cyan)";
            }
        }
    });
        // 🔊 ऑफलाइन इलेक्ट्रॉनिक साइरन वेरिएबल्स और फंक्शन्स
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let sirenPlaying = false;

    function startSiren() {
        if (sirenPlaying) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        oscillator.type = 'sawtooth'; 
        oscillator.frequency.setValueAtTime(850, audioCtx.currentTime);
        
        setInterval(() => {
            if (sirenPlaying && oscillator) {
                oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                oscillator.frequency.linearRampToValueAtTime(850, audioCtx.currentTime + 0.4);
            }
        }, 400);

        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); 
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        sirenPlaying = true;
    }

    function stopSiren() {
        if (!sirenPlaying) return;
        if (oscillator) {
            oscillator.stop();
            oscillator.disconnect();
            oscillator = null;
        }
        sirenPlaying = false;
    }

    hackerInput.addEventListener('input', () => {
        let val = hackerInput.value;
        let words = val.split(' ');
        let longestWord = Math.max(...words.map(w => w.length));
        if (longestWord >= 15 && val.length > 15) {
            startSiren();
        } else {
            stopSiren();
        }
        if (val.length === 0) {
            stopSiren();
        }
    });
    
    // 🧠 एडवांस एंटी-फेक और की-होल्ड वेरिएबल्स
    let keyHoldTimeout = null;
    let isKeyBeingHeld = false;
    let lastDeletedWord = "";
    let rewriteCount = 0;
    let lastInputType = "";

    // कीबोर्ड बटन दबाए रखने को ट्रैक करने का लॉजिक (10 सेकंड डिटेक्शन)
    hackerInput.addEventListener('keydown', (e) => {
        if (e.repeat) {
            if (!isKeyBeingHeld) {
                isKeyBeingHeld = true;
                // ⏱️ यदि कोई भी बटन लगातार 10 सेकंड से ज्यादा दबाकर रखेगा तो साइरन बजेगा
                keyHoldTimeout = setTimeout(() => {
                    if (isKeyBeingHeld) {
                        startSiren();
                        statusText.innerText = "[ALERT: CRITICAL KEY-HOLD SPAM DETECTED]";
                        statusText.className = "alert-active";
                        statusText.style.color = "var(--neon-red)";
                    }
                }, 10000); // टाइमर को घटाकर सिर्फ 10 सेकंड कर दिया गया है
            }
        }
    });

    hackerInput.addEventListener('keyup', () => {
        isKeyBeingHeld = false;
        clearTimeout(keyHoldTimeout);
        let val = hackerInput.value;
        let words = val.split(' ');
        let longestWord = Math.max(...words.map(w => w.length));
        let hasSpamPatterns = /(.)\1\1\1\1/.test(val);
        if (!(longestWord >= 16 && hasSpamPatterns) && rewriteCount < 4) {
            stopSiren();
        }
    });

    // मुख्य इनपुट मॉनिटर (तेज़ स्पैम, शब्द काटना-लिखना और स्पीड चेकर)
    hackerInput.addEventListener('input', (e) => {
        if (!startTime) startTime = Date.now();
        let val = hackerInput.value;
        
        if (e.inputType === 'deleteContentBackward') {
            backspaceCount++;
        }
        totalKeys = val.length + backspaceCount;

        let timePassed = (Date.now() - startTime) / 60000;
        let cpm = timePassed > 0 ? Math.round(val.length / timePassed) : 0;

        let words = val.trim().split(/\s+/);
        let longestWord = Math.max(...words.map(w => w.length));
        
        let hasSpamPatterns = /(.)\1\1\1\1/.test(val);

        let currentWord = words[words.length - 1] || "";
        if (e.inputType === 'deleteContentBackward') {
            lastDeletedWord = currentWord;
        }
        if (lastInputType === 'deleteContentBackward' && e.inputType !== 'deleteContentBackward') {
            if (currentWord.length > 1 && lastDeletedWord.startsWith(currentWord.substring(0, 2))) {
                rewriteCount++;
            } else {
                rewriteCount = 0;
            }
        }
        lastInputType = e.inputType;

        if (val.length === 0) {
            currentStress = 0;
            currentFocus = 0;
            rewriteCount = 0;
            stressVal.innerText = "0%";
            focusVal.innerText = "0%";
            statusText.innerText = "WAITING FOR BIO-INPUT...";
            statusText.className = "";
            statusText.style.color = "var(--neon-cyan)";
            stopSiren();
            return;
        }

        let isFakeTyping = (longestWord >= 16 && hasSpamPatterns) || (cpm > 280 && hasSpamPatterns) || (rewriteCount >= 4);

        if (isFakeTyping) {
            stressVal.innerText = "--";
            focusVal.innerText = "--";
            statusText.innerText = rewriteCount >= 4 ? "[🚨 ALERT: DESTRUCTIVE REWRITE LOOP DETECTED]" : "[ALERT: FAKE INTENT / TIME-PASS DETECTED]";
            statusText.className = "alert-active";
            statusText.style.color = "var(--neon-red)";
            isCurrentlyFake = true;
            startSiren();
        } else {
            isCurrentlyFake = false;
            stopSiren();

            currentFocus = Math.min(Math.max(Math.round(cpm / 2.5), 15), 98);
            let baseStress = 12;
            if (totalKeys > 0) {
                baseStress += Math.round((backspaceCount / totalKeys) * 140);
            }
            if (cpm > 240) baseStress += 20; 
            currentStress = Math.min(Math.max(baseStress, 6), 95);

            stressVal.innerText = currentStress + "%";
            focusVal.innerText = currentFocus + "%";

            if (currentStress > 58) {
                statusText.innerText = "[🚨 CRITICAL EMOTIONAL OVERLOAD / ALERT SENT]";
                statusText.className = "alert-active";
                statusText.style.color = "var(--neon-red)";
            } else if (currentFocus > 65) {
                statusText.innerText = "[SYSTEM STATUS: HYPER FOCUS / ALPHA MODE]";
                statusText.className = "";
                statusText.style.color = "var(--neon-green)";
            } else {
                statusText.innerText = "[SYSTEM STATUS: BALANCED MATRIX]";
                statusText.className = "";
                statusText.style.color = "var(--neon-cyan)";
            }
        }
    });
    
           </script>
</body>
</html>
