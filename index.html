<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHETNA Bio-Digital OS - Core Terminal</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --terminal-box: #0a0f1d;
            --neon-green: #00ff66;
            --neon-cyan: #00e5ff;
            --neon-red: #ff0055;
            --text-color: #d1f4ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .terminal-container {
            max-width: 600px;
            width: 100%;
            background: var(--terminal-box);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            box-sizing: border-box;
        }

        .system-header {
            text-align: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--neon-green);
            font-size: 20px;
            margin: 0;
            letter-spacing: 2px;
        }

        .status-tag {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 5px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #020408;
            border: 1px solid var(--neon-green);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        .graph-wrapper {
            background: #020408;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            height: 100px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .metric-card {
            background: #020408;
            border-left: 4px solid var(--neon-green);
            padding: 12px;
            border-radius: 4px;
        }

        .metric-card.stress { border-left-color: var(--neon-red); }

        .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }

        #stressVal { color: var(--neon-red); }
        #focusVal { color: var(--neon-green); }

        .status-bar {
            background: #020408;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        #statusText {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="system-header">
        <h1>[CHETNA BIO-DIGITAL OS v1.5]</h1>
        <div class="status-tag">CORE INFRASTRUCTURE: ONLINE // BIO-ENGINE FIXED</div>
    </div>

    <div class="radar-box">
        <textarea id="hackerInput" placeholder="> टाइप करना शुरू करें... बायो-सिग्नल्स रडार सक्रिय है..."></textarea>
    </div>

    <div class="graph-wrapper">
        <canvas id="liveGraph"></canvas>
    </div>

    <div class="metrics-grid">
        <div class="metric-card stress">
            <div class="label">// तनाव इंडेक्स (STRESS)</div>
            <div id="stressVal" class="value">0%</div>
        </div>
        <div class="metric-card">
            <div class="label">// दिमागी एकाग्रता (FOCUS)</div>
            <div id="focusVal" class="value">0%</div>
        </div>
    </div>

    <div class="status-bar">
        <div id="statusText" style="color: var(--neon-cyan);">WAITING FOR BIO-INPUT...</div>
    </div>
</div>

<script>
    const hackerInput = document.getElementById('hackerInput');
    const stressVal = document.getElementById('stressVal');
    const focusVal = document.getElementById('focusVal');
    const statusText = document.getElementById('statusText');
    const canvas = document.getElementById('liveGraph');
    const ctx = canvas.getContext('2d');

    let totalKeys = 0;
    let backspaceCount = 0;
    let startTime = null;
    let waveOffset = 0;
    let currentStress = 0;
    let currentFocus = 0;
    let isCurrentlyFake = false;

    // कैनवास फिक्स (यह एनीमेशन लूप को कभी क्रैश नहीं होने देगा)
    canvas.width = 560;
    canvas.height = 100;

    // 🚔 तीखा पुलिस साइरन इंजन
    let audioCtx = null;
    let osc1 = null;
    let osc2 = null;
    let gainNode = null;
    let sirenPlaying = false;
    let sirenInterval = null;

    function startSiren() {
        if (sirenPlaying) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            osc1 = audioCtx.createOscillator();
            osc2 = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            osc1.type = 'sawtooth';
            osc2.type = 'sine';
            
            osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(605, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime); 
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.start();
            osc2.start();
            sirenPlaying = true;

            let up = true;
            sirenInterval = setInterval(() => {
                if (!sirenPlaying || !osc1 || !osc2) return;
                let now = audioCtx.currentTime;
                if (up) {
                    osc1.frequency.linearRampToValueAtTime(1300, now + 0.24);
                    osc2.frequency.linearRampToValueAtTime(1305, now + 0.24);
                    up = false;
                } else {
                    osc1.frequency.linearRampToValueAtTime(600, now + 0.24);
                    osc2.frequency.linearRampToValueAtTime(605, now + 0.24);
                    up = true;
                }
            }, 250);
        } catch (e) {}
    }

    function stopSiren() {
        if (!sirenPlaying) return;
        if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
        try {
            if (osc1) { osc1.stop(); osc1.disconnect(); osc1 = null; }
            if (osc2) { osc2.stop(); osc2.disconnect(); osc2 = null; }
        } catch (e) {}
        sirenPlaying = false;
    }

    // 🌊 अजेय और अटूट एनीमेशन वेव लूप
    function animateGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        
        ctx.strokeStyle = isCurrentlyFake ? '#ff0055' : '#00e5ff';

        let textLen = hackerInput.value.length;
        let amplitude = textLen > 0 ? (currentStress > 50 ? 25 : 12) : 5;
        let frequency = isCurrentlyFake ? 0.2 : 0.08;

        for (let x = 0; x < canvas.width; x++) {
            let y = (canvas.height / 2) + Math.sin(x * frequency + waveOffset) * amplitude;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        waveOffset += 0.14;
        requestAnimationFrame(animateGraph);
    }
    
    // बूट होते ही एनीमेशन को ज़बरदस्ती ऑन करना
    animateGraph();

    // 🧠 कोर व्यवहारिक फ़िल्टर
    let lastDeletedWord = "";
    let rewriteCount = 0;
    let lastInputType = "";

    hackerInput.addEventListener('input', (e) => {
        if (!startTime) startTime = Date.now();
        let val = hackerInput.value;
        
        if (e.inputType === 'deleteContentBackward') backspaceCount++;
        totalKeys = val.length + backspaceCount;

        let timePassed = (Date.now() - startTime) / 60000;
        let cpm = timePassed > 0 ? Math.round(val.length / timePassed) : 0;

        let words = val.trim().split(/\s+/);
        
        // क्रैश प्रोटेक्शन चेक
        let longestWord = 0;
        if (words.length > 0 && words[0] !== "") {
            longestWord = Math.max(...words.map(w => w.length));
        }

        // 🧠 स्वर (Vowel) और रैंडम कीबोर्ड रो डिटेक्शन
        let containsFakePattern = false;
        if (words.length > 0 && words[0] !== "") {
            for (let i = 0; i < words.length; i++) {
                let word = words[i].toLowerCase();
                if (word.length >= 4) {
                    let hasVowel = /[aeiouyआइईउऊएऐओऔािीुूेैोौ]/.test(word);
                    let isKeyboardRowSpam = /asd|sdf|dfg|fgh|ghj|hjk|jkl|qwe|wer|ert|rty|tyu|yui|uio|iop|zxc|xcv|cvb/.test(word);
                    if (!hasVowel || isKeyboardRowSpam) {
                        containsFakePattern = true;
                    }
                }
            }
        }
        
        let hasSingleCharSpam = /(.)\1\1\1\1/.test(val);
        
        // 🔒 अचूक निर्णय: बकवास स्पैम होने पर ही साइरन गूँजेगा। असली लंबे शब्द बिल्कुल सुरक्षित हैं!
        isCurrentlyFake = containsFakePattern || hasSingleCharSpam;

        // बैकस्पेस मिटाना-लिखना ट्रैकर
        let currentWord = words[words.length - 1] || "";
        if (e.inputType === 'deleteContentBackward') lastDeletedWord = currentWord;
        if (lastInputType === 'deleteContentBackward' && e.inputType !== 'deleteContentBackward') {
