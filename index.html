<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHETNA Bio-Digital OS - Advanced Terminal</title>
    <style>
        :root {
            --bg-dark: #030508;
            --terminal-box: rgba(10, 15, 29, 0.85);
            --neon-green: #00ff66;
            --neon-cyan: #00e5ff;
            --neon-red: #ff0055;
            --text-color: #d1f4ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* 🦁 दहाड़ते हुए शेर का खूबसूरत बैकग्राउंड वाटरमार्क */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background-image: url('https://unsplash.com');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.06;
            pointer-events: none;
            z-index: -1;
            filter: grayscale(1) contrast(1.5);
        }

        .terminal-container {
            max-width: 600px;
            width: 100%;
            background: var(--terminal-box);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .system-header {
            text-align: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--neon-green);
            font-size: 18px;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            letter-spacing: 2px;
        }

        .status-tag {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 5px;
        }

        .radar-box {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: rgba(2, 4, 8, 0.9);
            border: 1px solid var(--neon-green);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .graph-wrapper {
            background: rgba(2, 4, 8, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            height: 110px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .graph-title {
            font-size: 10px;
            color: #64748b;
            position: absolute;
            top: 5px;
            left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 🟢🔴 गोलाकार डिज़ाइन ग्रिड */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(2, 4, 8, 0.8);
            border: 1px solid var(--neon-green);
            padding: 15px 10px;
            border-radius: 50% / 15%;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
            transition: all 0.3s ease;
        }

        .metric-card.stress { 
            border-color: var(--neon-red); 
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        #stressVal { color: var(--neon-red); text-shadow: 0 0 8px rgba(255,0,85,0.4); }
        #focusVal { color: var(--neon-green); text-shadow: 0 0 8px rgba(0,255,102,0.4); }

        .status-bar {
            background: rgba(2, 4, 8, 0.9);
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #statusText {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .alert-active {
            color: var(--neon-red) !important;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="system-header">
        <h1>[CHETNA BIO-DIGITAL OS v1.3]</h1>
        <div class="status-tag">CORE INFRASTRUCTURE ACTIVE // BEHAVIORAL RADAR</div>
    </div>

    <div class="radar-box">

    </div>

    <div class="graph-wrapper">

        <canvas id="liveGraph"></canvas>
    </div>

    <div class="metrics-grid">
        <div class="metric-card stress">
            <div class="label">// तनाव रडार (STRESS)</div>
            <div id="stressVal" class="value">0%</div>
        </div>
        <div class="metric-card">
            <div class="label">// एकाग्रता रडार (FOCUS)</div>
            <div id="focusVal" class="value">0%</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="label">// डायग्नोस्टिक्स टर्मिनल विश्लेषण</div>
        <div id="statusText" style="color: var(--neon-cyan);">WAITING FOR BIO-INPUT...</div>
    </div>
</div>

<script>

    let audioCtx = null;
    let osc1 = null;
    let osc2 = null;
    let gainNode = null;
    let sirenPlaying = false;
    let sirenInterval = null;

    function startSiren() {
        if (sirenPlaying) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            osc1 = audioCtx.createOscillator();
            osc2 = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            osc1.type = 'sawtooth';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(605, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); 
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc1.start();
            osc2.start();
            sirenPlaying = true;

            let up = true;
            sirenInterval = setInterval(() => {
                if (!sirenPlaying || !osc1 || !osc2) return;
                let now = audioCtx.currentTime;
                if (up) {
                    osc1.frequency.linearRampToValueAtTime(1300, now + 0.25);
                    osc2.frequency.linearRampToValueAtTime(1305, now + 0.25);
                    up = false;
                } else {
                    osc1.frequency.linearRampToValueAtTime(600, now + 0.25);
                    osc2.frequency.linearRampToValueAtTime(605, now + 0.25);
                    up = true;
                }
            }, 260);
        } catch (e) {}
    }

    function stopSiren() {
        if (!sirenPlaying) return;
        if (sirenInterval) {
            clearInterval(sirenInterval);
            sirenInterval = null;
        }
        try {
            if (osc1) { osc1.stop(); osc1.disconnect(); osc1 = null; }
            if (osc2) { osc2.stop(); osc2.disconnect(); osc2 = null; }
        } catch (e) {}
        sirenPlaying = false;
    }
