<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHETNA Bio-Digital OS - Terminal v1.0</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --terminal-box: #0a0f1d;
            --neon-green: #00ff66;
            --neon-cyan: #00e5ff;
            --neon-red: #ff0055;
            --matrix-glow: rgba(0, 255, 102, 0.2);
            --text-color: #d1f4ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .terminal-container {
            max-width: 600px;
            width: 100%;
            background: var(--terminal-box);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            box-sizing: border-box;
        }

        .system-header {
            text-align: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--neon-green);
            font-size: 20px;
            margin: 0;
            text-shadow: 0 0 10px var(--matrix-glow);
            letter-spacing: 2px;
        }

        .status-tag {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 5px;
        }

        .radar-box {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #020408;
            border: 1px solid var(--neon-green);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* धांसू हैकिंग लाइव ग्राफ */
        .graph-wrapper {
            background: #020408;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            height: 100px;
            position: relative;
        }

        .graph-title {
            font-size: 10px;
            color: #64748b;
            position: absolute;
            top: 5px;
            left: 10px;
            text-transform: uppercase;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .metric-card {
            background: #020408;
            border-left: 4px solid var(--neon-green);
            padding: 12px;
            border-radius: 4px;
        }

        .metric-card.stress { border-left-color: var(--neon-red); }

        .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }

        #stressVal { color: var(--neon-red); }
        #focusVal { color: var(--neon-green); }

        .status-bar {
            background: #020408;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        #statusText {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .alert-active {
            color: var(--neon-red) !important;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="system-header">
        <h1>[CHETNA BIO-DIGITAL OS v1.0]</h1>
        <div class="status-tag">CORE STATUS: ONLINE // ANTIDOTE CORE ACTIVE</div>
    </div>

    <div class="radar-box">
        <textarea id="hackerInput" placeholder="> यहाँ टाइप करना शुरू करें... बायो-सिग्नल्स रडार सक्रिय हो जाएगा..."></textarea>
    </div>

    <!-- लाइव ग्राफ -->
    <div class="graph-wrapper">
        <div class="graph-title">// लाइव न्यूरो-बायो स्पेक्ट्रोग्राम (LIVE SIGNALS)</div>
        <canvas id="liveGraph"></canvas>
    </div>

    <div class="metrics-grid">
        <div class="metric-card stress">
            <div class="label">// तनाव इंडेक्स (STRESS)</div>
            <div id="stressVal" class="value">0%</div>
        </div>
        <div class="metric-card">
            <div class="label">// दिमागी एकाग्रता (FOCUS)</div>
            <div id="focusVal" class="value">0%</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="label">// सिस्टम डायग्नोस्टिक्स विश्लेषण</div>
        <div id="statusText" style="color: var(--neon-cyan);">WAITING FOR BIO-INPUT...</div>
    </div>
</div>

<script>
    const hackerInput = document.getElementById('hackerInput');
    const stressVal = document.getElementById('stressVal');
    const focusVal = document.getElementById('focusVal');
    const statusText = document.getElementById('statusText');
    const canvas = document.getElementById('liveGraph');
    const ctx = canvas.getContext('2d');

    let totalKeys = 0;
    let backspaceCount = 0;
    let startTime = null;
    let micActivated = false;
    let graphActive = false;
    let waveOffset = 0;

    // ग्राफ कैनवास का साइज सेट करना
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. ऑटो-माइक एक्टिवेशन परमिशन
    function initAutoMic() {
        if (!micActivated) {
            navigator.mediaDevices.getUserMedia({ audio: true })
            .then(() => {
                micActivated = true;
                console.log("माइक बैकग्राउंड में एक्टिवेट हो गया है।");
            })
            .catch(() => {
                console.log("माइक परमिशन पेंडिंग है।");
            });
        }
    }

    // 2. धांसू हैकिंग ग्राफ एनिमेशन
    function drawGraph(stressScore, focusScore, isFake) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.beginPath();
        ctx.lineWidth = 2;
        
        // फेक कोडिंग होने पर लाल डैमेज लहरें, असली पर हरी-नीली लहरें
        if (isFake) {
            ctx.strokeStyle = '#ff0055';
        } else {
            ctx.strokeStyle = '#00e5ff';
        }

        let amplitude = graphActive ? (stressScore > 50 ? 25 : 12) : 2;
        let frequency = isFake ? 0.2 : 0.08;

        for (let x = 0; x < canvas.width; x++) {
            let y = (canvas.height / 2) + Math.sin(x * frequency + waveOffset) * amplitude;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        waveOffset += 0.15;
        if (graphActive) {
            requestAnimationFrame(() => drawGraph(stressScore, focusScore, isFake));
        }
    }

    // 3. मुख्य इनपुट और एंटी-फेक फ़िल्टर लॉजिक
    hackerInput.addEventListener('input', (e) => {
        if (!startTime) {
            startTime = Date.now();
            initAutoMic(); // टाइपिंग शुरू होते ही माइक चालू
            graphActive = true;
        }

        let val = hackerInput.value;

        if (e.inputType === 'deleteContentBackward') {
            backspaceCount++;
        }
        totalKeys = val.length + backspaceCount;

        let timePassed = (Date.now() - startTime) / 60000;
        let cpm = timePassed > 0 ? Math.round(val.length / timePassed) : 0;

        // --- एंटी-फेक (किडमिट-किडमिट) फ़िल्टर ---
        // नियम: अगर बिना स्पेस दिए लगातार 12 से ज्यादा अक्षर टाइप किए जाएं (जैसे sssdddfff)
        let words = val.split(' ');
        let longestWord = Math.max(...words.map(w => w.length));
        let isFake = longestWord > 12 && val.length > 15;

        let stressScore = 0;
        let focusScore = 0;

        if (val.length === 0) {
            stressVal.innerText = "0%";
            focusVal.innerText = "0%";
            statusText.innerText = "WAITING FOR BIO-INPUT...";
            statusText.className = "";
            statusText.style.color = "var(--neon-cyan)";
            graphActive = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        if (isFake) {
            // फेक इनपुट होने पर रडार ब्लॉक
            stressVal.innerText = "--";
            focusVal.innerText = "--";
            statusText.innerText = "[ALERT: FAKE INTENT / TIME-PASS DETECTED]";
            statusText.className = "alert-active";
            statusText.style.color = "var(--neon-red)";
            drawGraph(90, 10, true);
        } else {
            // असली इनपुट होने पर गणना चालू
            focusScore = Math.min(Math.max(Math.round(cpm / 2.5), 15), 98);
            
            let baseStress = 12;
            if (totalKeys > 0) {
                baseStress += Math.round((backspaceCount / totalKeys) * 140);
            }
            if (cpm > 240) baseStress += 20; // हड़बड़ी
            stressScore = Math.min(Math.max(baseStress, 6), 95);

            stressVal.innerText = stressScore + "%";
            focusVal.innerText = focusScore + "%";

            // स्टेटस और क्रिटिकल डिप्रेशन अलर्ट निर्णय
            if (stressScore > 58) {
